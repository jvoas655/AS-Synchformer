action: train_avsync_model
model:
  target: model.sync_model.StreamingSynchformer
  params:
    afeat_extractor:
      is_trainable: false
      target: model.modules.feat_extractors.audio.ast.AST
      params:
        ckpt_path: null
        extract_features: true
        max_spec_t: 66
        factorize_freq_time: true
        agg_freq_module: TransformerEncoderLayer
        agg_time_module: torch.nn.Identity
        add_global_repr: false
    vfeat_extractor:
      is_trainable: false
      target: model.modules.feat_extractors.visual.motionformer.MotionFormer
      params:
        ckpt_path: null
        extract_features: true
        factorize_space_time: true
        agg_space_module: TransformerEncoderLayer
        agg_time_module: torch.nn.Identity
        add_global_repr: false
    aproj:
      target: torch.nn.Linear
      params:
        in_features: 768
        out_features: 768
    vproj:
      target: torch.nn.Linear
      params:
        in_features: 768
        out_features: 768
    target_topk: 4
    random_crop: false
    overlap: null
    encode_segments_per_batch: 24
    transformer:
      target: model.sync_model.SyncHead
      params:
        n_layer: 3
        n_head: 8
        n_embd: 768
        num_stream_tokens_per_window: 8
        num_codebooks: 0
        codebook_size: 0
        tok_pdrop: 0.0
        embd_pdrop: 0.1
        resid_pdrop: 0.0
        attn_pdrop: 0.0
        conf_pred_bins: 0
        pos_emb_cfg:
          target: model.modules.transformer.RandInitPositionalEncoding
          params:
            block_shape:
            - 198
            n_embd: 768
        off_head_cfg:
          target: torch.nn.Linear
          params:
            in_features: 768
            out_features: 21
            bias: true
    streaming_head:
      target: model.sync_model.StreamingHead
      params:
        use_contextual_selectors: true
        n_layer: 3
        n_head: 8
        n_embd: 768
        tok_pdrop: 0.0
        embd_pdrop: 0.1
        resid_pdrop: 0.0
        attn_pdrop: 0.0
        max_period: 200
        pos_dim: 256
        conf_pred_bins: 0
        off_head_cfg:
          target: torch.nn.Linear
          params:
            in_features: 768
            out_features: 21
            bias: true
training:
  lora:
    enabled: false
    load_first: true
    target_modules:
    - - transformer
    r:
    - 64
    alpha:
    - 128
    lora_target_submodules:
    - - query
      - key
      - value
      - proj
      - off_head
    layers_to_transform:
    - null
    layers_pattern:
    - null
    lora_dropout:
    - 0.0
    use_dora:
    - false
    bias:
    - none
  stage_1_frozen_submodules:
  - .*
  stage_2_unfrozen_submodules:
  - .*
  stage_3_frozen_submodules:
  - .*afeat_extractor.*
  - .*vfeat_extractor.*
  - .*
  stage_4_unfrozen_submodules:
  - .*transformer.*
  - .*vproj.*
  - .*aproj.*
  - .*inv_vproj.*
  - .*skip_embed.*
  - .*lora.*
  - .*streaming_head.*
  - .*conf_pred_head.*
  - .*STREAM_tok.*
  - .*CONF_tok.*
  - .*stream_head.*
  - .*quantizer.*
  - .*codebook_heads.*
  - .*streaming_contrastive_head.*
  base_learning_rate: 5.0e-06
  base_batch_size: 6
  encode_segments_per_batch: 24
  predict_aud_repr_shift: false
  loss_fns:
  - cross_entropy
  - EMD
  - cls_contrastive
  - align_repr
  - reg_sml1
  acum_steps: 1
  num_workers: 8
  num_epochs: 10000
  patience: 20
  to_max_metric:
  - true
  reset_metric: false
  metric_name:
  - accuracy_1
  early_stop_phase: valid
  use_half_precision: true
  seed: 1341
  compile: false
  skip_test: false
  run_test_only: false
  resume: false
  finetune: true
  startup_validate: true
  validate_only: false
  dist_backend: nccl
  max_clip_norm: 1
  sample_temp: 0.8
  target_topk: 4
  lr_scheduler:
    name: cosine_with_warm_restarts
    warmup: 100
    T_0: 2000
    T_mult: 2
    restart_decay_factor: 0.9
    eta_min: 1.0e-06
  optimizer:
    name: adamw
    betas:
    - 0.9
    - 0.999
    momentum: 0.9
    weight_decay: 0
  copy_weights: null
  local_rank: 0
  global_rank: 0
  world_size: 32
data:
  offset_type: grid
  num_off_cls: 21
  prob_oos: null
  max_off_sec: 2
  crop_len_sec: 10
  loading_shift:
  - 2
  - 2
  loading_buffer: 1
  step_size_seg: 0.5
  vids_path: /work/08659/jvoas/vista/synch/datasets/ego4d-salt/Ego4D-reencoded/
  size_before_crop: 256
  input_size: 224
  segment_size_vframes: 16
  vfps: 25
  afps: 16000
  n_segments: 30
  do_offset: true
  p_color_jitter: 0.0
  p_gray_scale: 0.0
  sometimes_upscale_p: 0.0
  is_spatial_crop_random: true
  is_temporal_crop_random: true
  audio_jitter_sec: 0.05
  p_horizontal_flip: 0.5
  p_audio_aug: 0.0
  skip_ids_path: /home1/08659/jvoas/Synchformer/skip_files.json
  dataset:
    target: dataset.ego_4d.Ego4D
    params:
      load_fixed_offsets_on:
      - test
      - valid
      splits_path: /work/08659/jvoas/vista/synch/datasets/ego4d-salt/script/
      vis_load_backend: read_video
      size_ratio:
        valid: 1.0
        test: 1.0
        train: 1.0
      sounds_only: false
transform_sequence_train:
- target: dataset.transforms.EqualifyFromRight
  params:
    clip_max_len_sec: 15
- target: dataset.transforms.RGBSpatialCropSometimesUpscale
  params:
    sometimes_p: 0.0
    smaller_input_size: 192
    target_input_size: 224
    is_random: true
- target: dataset.transforms.TemporalCropAndOffset
  params:
    crop_len_sec: 10
    max_off_sec: 2
    max_wiggle_sec: 0.05
    do_offset: true
    offset_type: grid
    prob_oos: null
    grid_size: 21
    segment_size_vframes: 16
    n_segments: 30
    step_size_seg: 0.5
